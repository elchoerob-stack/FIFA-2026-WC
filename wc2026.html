<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WC2026">
<link rel="manifest" href="./manifest.json">
<title>FIFA World Cup 2026™</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap');
  :root{
    --green:#00A650;--gold:#C8A84B;--dark:#0a0f0d;--card:#111a14;
    --border:#1e2e22;--text:#e8f0ea;--muted:#6b8572;
    --live:#ff4444;--finished:#00A650;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}

  /* ── HEADER ── */
  header{background:linear-gradient(135deg,#0a1f0f,#0d2a15,#0a1f0f);border-bottom:2px solid var(--gold);padding:16px 16px 10px;text-align:center;position:sticky;top:0;z-index:100;}
  .header-top{display:flex;align-items:center;justify-content:center;gap:10px;position:relative;}
  .header-badge{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:3px;}
  header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,5vw,42px);letter-spacing:4px;color:#fff;line-height:1;}
  header h1 span{color:var(--gold);}
  .header-sub{margin-top:3px;font-size:10px;color:var(--muted);letter-spacing:1px;}
  .last-updated{margin-top:2px;font-size:10px;color:#3a5040;}

  /* INSTALL BUTTON */
  #installBtn{
    display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);
    background:var(--gold);color:var(--dark);border:none;
    border-radius:8px;padding:6px 10px;font-size:10px;font-weight:700;
    cursor:pointer;line-height:1.2;text-align:center;letter-spacing:.3px;
    box-shadow:0 2px 8px rgba(200,168,75,.3);
  }
  #installBtn:hover{background:#e0c060;}
  #installBtn .install-icon{font-size:14px;display:block;}

  /* ── PREDICTION BAR ── */
  .pred-accuracy-bar{
    background:#0d1e10;border-bottom:1px solid var(--border);
    padding:10px 16px;
  }
  .pred-bar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .pred-bar-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
  .pred-bar-stats{display:flex;gap:14px;}
  .pred-stat{text-align:center;}
  .pred-stat-val{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;}
  .pred-stat-val.exact{color:var(--gold);}
  .pred-stat-val.result{color:var(--green);}
  .pred-stat-val.wrong{color:#e07070;}
  .pred-stat-val.pending{color:var(--muted);}
  .pred-stat-lbl{font-size:9px;color:#3a5040;text-transform:uppercase;letter-spacing:.8px;}
  /* the bar track */
  .pred-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden;display:flex;}
  .pred-seg{height:100%;transition:width .6s ease;}
  .pred-seg.exact{background:var(--gold);}
  .pred-seg.result{background:var(--green);}
  .pred-seg.wrong{background:#5a2020;}
  .pred-seg.pending{background:#1e2e22;}
  .pred-bar-legend{display:flex;gap:12px;margin-top:5px;flex-wrap:wrap;}
  .pred-legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);}
  .pred-legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

  /* ── TABS ── */
  .tab-bar{display:flex;border-bottom:1px solid var(--border);background:#0c170f;position:sticky;top:var(--sticky-top,156px);z-index:99;overflow-x:auto;}
  .tab-btn{flex:1;min-width:68px;padding:10px 4px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;}
  .tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
  .tab-btn:hover:not(.active){color:var(--text);}

  /* TAB PANELS */
  .tab-panel{display:none;padding:14px 14px 56px;max-width:920px;margin:0 auto;}
  .tab-panel.active{display:block;}

  /* CONTROLS */
  .controls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;}
  .refresh-btn{background:var(--gold);border:none;color:var(--dark);padding:6px 16px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;}
  .refresh-btn:hover{background:#e0c060;}
  .refresh-btn.loading{opacity:.6;pointer-events:none;}

  /* DATE DIVIDER */
  .date-divider{display:flex;align-items:center;gap:10px;margin:16px 0 8px;padding:0 2px;}
