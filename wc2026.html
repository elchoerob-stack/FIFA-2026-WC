<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f0d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WC 2026">
<link rel="manifest" href="./manifest.json">
<title>WC 2026</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap');
:root{--green:#00A650;--gold:#C8A84B;--dark:#0a0f0d;--card:#111a14;--border:#1e2e22;--text:#e8f0ea;--muted:#6b8572;--finished:#00A650;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--dark);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
.sticky-top{position:sticky;top:0;z-index:100;}
header{background:linear-gradient(135deg,#0a1f0f,#0d2a15,#0a1f0f);border-bottom:2px solid var(--gold);padding:14px 16px 10px;text-align:center;position:relative;}
.header-badge{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:3px;}
header h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(20px,5vw,42px);letter-spacing:4px;color:#fff;line-height:1;}
header h1 span{color:var(--gold);}
.header-sub{margin-top:3px;font-size:10px;color:var(--muted);letter-spacing:1px;}
.last-updated{margin-top:2px;font-size:10px;color:#3a5040;}
.pred-accuracy-bar{background:#0d1e10;border-bottom:1px solid var(--border);padding:8px 16px;}
.pred-bar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.pred-bar-title{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);}
.pred-bar-stats{display:flex;gap:14px;}
.pred-stat{text-align:center;}
.pred-stat-val{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;}
.pred-stat-val.exact{color:var(--gold);}
.pred-stat-val.result{color:var(--green);}
.pred-stat-val.wrong{color:#e07070;}
.pred-stat-val.pending{color:var(--muted);}
.pred-stat-lbl{font-size:9px;color:#3a5040;text-transform:uppercase;letter-spacing:.8px;}
.pred-track{height:7px;background:var(--border);border-radius:4px;overflow:hidden;display:flex;}
.pred-seg{height:100%;transition:width .6s ease;}
.pred-seg.exact{background:var(--gold);}
.pred-seg.result{background:var(--green);}
.pred-seg.wrong{background:#5a2020;}
.pred-seg.pending{background:#1e2e22;}
.pred-bar-legend{display:flex;gap:12px;margin-top:4px;flex-wrap:wrap;}
.pred-legend-item{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);}
.pred-legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.tab-bar{display:flex;border-bottom:1px solid var(--border);background:#0c170f;overflow-x:auto;}
.tab-btn{flex:1;min-width:68px;padding:10px 4px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab-btn:hover:not(.active){color:var(--text);}
.tab-panel{display:none;padding:14px 14px 56px;max-width:920px;margin:0 auto;}
.tab-panel.active{display:block;}
.date-divider{display:flex;align-items:center;gap:10px;margin:16px 0 8px;padding:0 2px;}
.date-divider-label{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:var(--gold);white-space:nowrap;}
.date-divider-line{flex:1;height:1px;background:var(--border);}
.match-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;padding:11px 12px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;position:relative;overflow:hidden;}
.match-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.match-card.status-finished::before{background:var(--finished);}
.match-card.status-upcoming::before{background:rgba(200,168,75,.35);}
.match-card.editable{cursor:pointer;}
.match-card.editable:active{background:#152018;}
.team-side{display:flex;flex-direction:column;gap:2px;}
.team-side.right{text-align:right;align-items:flex-end;}
.team-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.2;}
.flag{font-size:17px;line-height:1;}
.match-center{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px;}
.match-status-badge{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:2px 7px;border-radius:10px;}
.badge-finished{background:var(--finished);color:#fff;}
.badge-upcoming{background:rgba(200,168,75,.12);color:var(--gold);border:1px solid rgba(200,168,75,.3);}
.score-block{display:flex;align-items:center;gap:5px;}
.score{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--text);min-width:22px;text-align:center;line-height:1;}
.score.pending{color:var(--muted);font-size:18px;}
.score-sep{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--muted);}
.pred-label{font-size:9px;color:#3d5040;text-transform:uppercase;letter-spacing:1px;}
.pred-score{font-size:10px;color:var(--muted);}
.pred-correct{color:var(--gold);}
.match-meta{display:flex;flex-direction:column;align-items:center;gap:1px;margin-top:3px;}
.match-date{font-size:10px;color:var(--muted);font-weight:500;}
.match-time{font-size:10px;color:var(--gold);font-weight:600;}
.match-venue{font-size:9px;color:#354d3d;text-align:center;line-height:1.3;}
.md-tag{font-size:8px;font-weight:700;letter-spacing:1px;color:#354d3d;text-transform:uppercase;}
.group-tag{font-size:9px;font-weight:700;letter-spacing:1px;color:#3a6040;text-transform:uppercase;background:rgba(0,166,80,.08);padding:1px 6px;border-radius:8px;border:1px solid rgba(0,166,80,.15);}
.result-score{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;color:var(--text);line-height:1;}
.result-sep{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--muted);}
.enter-score-hint{font-size:9px;color:var(--muted);margin-top:2px;letter-spacing:.5px;}
.empty-state{text-align:center;padding:48px 24px;color:var(--muted);}
.empty-state .empty-icon{font-size:40px;margin-bottom:12px;}
.empty-state p{font-size:13px;line-height:1.6;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-top:2px solid var(--gold);border-radius:16px 16px 0 0;padding:22px 20px 36px;width:100%;max-width:480px;}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--gold);text-align:center;margin-bottom:4px;}
.modal-match{font-size:12px;color:var(--muted);text-align:center;margin-bottom:20px;}
.modal-teams{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:20px;}
.modal-team{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.modal-team-flag{font-size:28px;}
.modal-team-name{font-size:11px;font-weight:600;color:var(--text);text-align:center;line-height:1.2;}
.modal-vs{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--muted);}
.score-inputs{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px;}
.score-input-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
.score-input-label{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.score-stepper{display:flex;align-items:center;}
.stepper-btn{width:44px;height:52px;background:#0d1e10;border:1px solid var(--border);color:var(--text);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.stepper-btn:first-child{border-radius:8px 0 0 8px;}
.stepper-btn:last-child{border-radius:0 8px 8px 0;}
.stepper-btn:active{background:#1a3020;}
.stepper-val{font-family:'Bebas Neue',sans-serif;font-size:38px;min-width:56px;text-align:center;background:#0a1510;border-top:1px solid var(--border);border-bottom:1px solid var(--border);height:52px;line-height:52px;color:var(--text);}
.score-sep-modal{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--muted);margin-top:22px;}
.modal-btns{display:flex;gap:10px;}
.modal-btn{flex:1;padding:14px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.modal-btn-cancel{background:#1a2e1e;color:var(--muted);}
.modal-btn-save{background:var(--gold);color:var(--dark);}
.modal-btn-clear{background:#2a1010;color:#e07070;font-size:11px;flex:0 0 auto;padding:14px 16px;}
.standings-group{margin-bottom:22px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card);}
.group-header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(90deg,#0d2215,var(--card));border-bottom:1px solid var(--border);}
.group-label{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--gold);}
.group-teams-list{font-size:10px;color:var(--muted);}
.standings-table{width:100%;border-collapse:collapse;}
.standings-table th{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);padding:7px 9px;text-align:right;border-bottom:1px solid var(--border);background:#0d1e10;}
.standings-table th:first-child,.standings-table td:first-child{text-align:left;padding-left:12px;}
.standings-table td{font-size:12px;padding:8px 9px;text-align:right;border-bottom:1px solid rgba(30,46,34,.6);}
.standings-table tr:last-child td{border-bottom:none;}
.standings-table tr:hover td{background:rgba(255,255,255,.02);}
.team-cell{display:flex;align-items:center;gap:6px;}
.pos-num{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--muted);min-width:11px;}
.pos-1,.pos-2{color:var(--gold);}
.td-pts{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);}
.td-gd.pos-gd{color:#5dcf8a;}
.td-gd.neg-gd{color:#e07070;}
.qual-bar{display:inline-block;width:4px;height:24px;border-radius:2px;margin-right:3px;vertical-align:middle;flex-shrink:0;}
.qual-1st{background:var(--gold);}
.qual-2nd{background:var(--green);}
.qual-3rd{background:#3a6648;}
.qual-out{background:transparent;}
.standings-note{font-size:10px;color:var(--muted);padding:7px 12px;border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap;}
.note-item{display:flex;align-items:center;gap:5px;}
.playoff-section{margin-bottom:26px;}
.playoff-section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:3px;color:var(--gold);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.playoff-grid{display:grid;gap:8px;}
.playoff-grid-2{grid-template-columns:1fr 1fr;}
.playoff-grid-1{grid-template-columns:1fr;}
.playoff-match{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.playoff-match-header{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;padding:5px 11px;background:#0d1e10;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.playoff-team-row{display:flex;align-items:center;justify-content:space-between;padding:8px 11px;border-bottom:1px solid rgba(30,46,34,.5);}
.playoff-team-row:last-of-type{border-bottom:none;}
.playoff-team-name{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;}
.playoff-team-name.tbd{color:var(--muted);font-style:italic;font-size:11px;font-weight:400;}
.playoff-score{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--text);}
.playoff-score.tbd-score{color:var(--border);font-size:16px;}
.playoff-winner .playoff-team-name{color:var(--gold);}
.playoff-winner .playoff-score{color:var(--gold);}
.playoff-match-meta{font-size:9px;color:#3a5040;padding:4px 11px 6px;text-align:center;}
.final-match{border:1px solid var(--gold);box-shadow:0 0 20px rgba(200,168,75,.1);}
.final-match .playoff-match-header{background:linear-gradient(90deg,#1a1400,#0d1e10);color:var(--gold);}
.install-banner{background:linear-gradient(90deg,#0d2215,#111a14);border:1px solid var(--gold);border-radius:12px;padding:14px 16px;margin:14px 14px 0;display:none;align-items:center;gap:12px;}
.install-banner.show{display:flex;}
.install-banner-icon{font-size:28px;flex-shrink:0;}
.install-banner-text{flex:1;}
.install-banner-text strong{display:block;font-size:13px;color:var(--gold);margin-bottom:2px;}
.install-banner-text span{font-size:11px;color:var(--muted);line-height:1.4;}
.install-banner-btn{background:var(--gold);color:var(--dark);border:none;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.install-banner-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 0 0 8px;line-height:1;flex-shrink:0;}
@media(max-width:500px){
  .playoff-grid-2{grid-template-columns:1fr;}
  .tab-btn{font-size:10px;padding:10px 2px;}
  .team-name{font-size:12px;}
  .result-score{font-size:26px;}
}
</style>
</head>
<body>

<div id="mainApp">

<div class="install-banner" id="installBanner">
  <div class="install-banner-icon">⚽</div>
  <div class="install-banner-text">
    <strong>Install App</strong>
    <span>Add to your home screen for the best experience.</span>
  </div>
  <button class="install-banner-btn" id="installBannerBtn" onclick="triggerInstall()">Install</button>
  <button class="install-banner-close" onclick="dismissBanner()">✕</button>
</div>

<div class="sticky-top">
  <header>
    <div class="header-badge">⚽ FIFA World Cup 2026™</div>
    <h1>World Cup <span>2026™</span></h1>
    <div class="header-sub">USA · CANADA · MEXICO &nbsp;|&nbsp; 11 JUN – 19 JUL</div>
    <div class="last-updated" id="lastUpdated"></div>
  </header>
  <div class="pred-accuracy-bar">
    <div class="pred-bar-header">
      <div class="pred-bar-title">🎯 Prediction Accuracy</div>
      <div class="pred-bar-stats">
        <div class="pred-stat"><div class="pred-stat-val exact" id="statExact">0</div><div class="pred-stat-lbl">Exact</div></div>
        <div class="pred-stat"><div class="pred-stat-val result" id="statResult">0</div><div class="pred-stat-lbl">Result</div></div>
        <div class="pred-stat"><div class="pred-stat-val wrong" id="statWrong">0</div><div class="pred-stat-lbl">Wrong</div></div>
        <div class="pred-stat"><div class="pred-stat-val pending" id="statPending">0</div><div class="pred-stat-lbl">To play</div></div>
      </div>
    </div>
    <div class="pred-track">
      <div class="pred-seg exact" id="segExact" style="width:0%"></div>
      <div class="pred-seg result" id="segResult" style="width:0%"></div>
      <div class="pred-seg wrong" id="segWrong" style="width:0%"></div>
      <div class="pred-seg pending" id="segPending" style="width:100%"></div>
    </div>
    <div class="pred-bar-legend">
      <div class="pred-legend-item"><div class="pred-legend-dot" style="background:var(--gold)"></div>Exact score</div>
      <div class="pred-legend-item"><div class="pred-legend-dot" style="background:var(--green)"></div>Correct result (W/D/L)</div>
      <div class="pred-legend-item"><div class="pred-legend-dot" style="background:#5a2020"></div>Wrong</div>
      <div class="pred-legend-item"><div class="pred-legend-dot" style="background:var(--border)"></div>Not yet played</div>
    </div>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('fixtures',this)">📅 Fixtures</button>
    <button class="tab-btn" onclick="switchTab('results',this)">✅ Results</button>
    <button class="tab-btn" onclick="switchTab('standings',this)">📊 Standings</button>
    <button class="tab-btn" onclick="switchTab('playoffs',this)">🏆 Playoffs</button>
  </div>
</div>

<div class="tab-panel active" id="tab-fixtures"><div id="fixturesContainer"></div></div>
<div class="tab-panel" id="tab-results"><div id="resultsContainer"></div></div>
<div class="tab-panel" id="tab-standings"><div id="standingsContainer"></div></div>
<div class="tab-panel" id="tab-playoffs"><div id="playoffsContainer"></div></div>
</div>

<!-- SCORE ENTRY MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-title">ENTER SCORE</div>
    <div class="modal-match" id="modalMatchLabel"></div>
    <div class="modal-teams">
      <div class="modal-team">
        <div class="modal-team-flag" id="modalFlagH"></div>
        <div class="modal-team-name" id="modalTeamH"></div>
      </div>
      <div class="modal-vs">VS</div>
      <div class="modal-team">
        <div class="modal-team-flag" id="modalFlagA"></div>
        <div class="modal-team-name" id="modalTeamA"></div>
      </div>
    </div>
    <div class="score-inputs">
      <div class="score-input-wrap">
        <div class="score-input-label" id="modalLabelH"></div>
        <div class="score-stepper">
          <button class="stepper-btn" onclick="step('H',-1)">−</button>
          <div class="stepper-val" id="stepH">0</div>
          <button class="stepper-btn" onclick="step('H',1)">+</button>
        </div>
      </div>
      <div class="score-sep-modal">–</div>
      <div class="score-input-wrap">
        <div class="score-input-label" id="modalLabelA"></div>
        <div class="score-stepper">
          <button class="stepper-btn" onclick="step('A',-1)">−</button>
          <div class="stepper-val" id="stepA">0</div>
          <button class="stepper-btn" onclick="step('A',1)">+</button>
        </div>
      </div>
    </div>
    <div class="modal-btns">
      <button class="modal-btn modal-btn-clear" onclick="clearScore()">Clear</button>
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-btn modal-btn-save" onclick="saveScore()">Save ✓</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// SCORES — persisted in localStorage
// ══════════════════════════════════════════════════════════
let SCORES = {};
try { SCORES = JSON.parse(localStorage.getItem('wc2026_scores') || '{}'); } catch(e){ SCORES = {}; }
function saveScores(){ localStorage.setItem('wc2026_scores', JSON.stringify(SCORES)); }

// ══════════════════════════════════════════════════════════
// FIXTURE DATA
// ══════════════════════════════════════════════════════════

    {md:3,home:'Bosnia & Herz.',away:'Qatar',predH:1,predA:0,date:'2026-06-24',timeUTC:'19:00',venue:'Seattle Stadium, Seattle'}]},
  {id:'C',teams:['Brazil','Morocco','Haiti','Scotland'],matches:[

let deferredPrompt = null;

function showInstallBanner(){
  if(window.matchMedia('(display-mode: standalone)').matches) return;
  if(sessionStorage.getItem('installDismissed')) return;
  document.getElementById('installBanner').classList.add('show');
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

window.addEventListener('appinstalled', () => {
  document.getElementById('installBanner').classList.remove('show');
  deferredPrompt = null;
});

function triggerInstall(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      document.getElementById('installBanner').classList.remove('show');
    });
  } else {
    alert('To install:\n\nTap the ⋮ menu in Chrome\n→ "Add to Home screen"');
  }
}

function dismissBanner(){
  sessionStorage.setItem('installDismissed','1');
  document.getElementById('installBanner').classList.remove('show');
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}

setTimeout(showInstallBanner, 1500);

// MODAL
// ══════════════════════════════════════════════════════════
let modalMatch = null, modalScoreH = 0, modalScoreA = 0;

function openModal(m){
  modalMatch = m;
  const ex = SCORES[matchKey(m)];
  modalScoreH = ex ? ex.scoreH : 0;
  modalScoreA = ex ? ex.scoreA : 0;
  document.getElementById('modalMatchLabel').textContent = `Group ${m._gid} · MD${m.md}`;
  document.getElementById('modalFlagH').textContent = FLAGS[m.home]||'🏳️';
  document.getElementById('modalFlagA').textContent = FLAGS[m.away]||'🏳️';
  document.getElementById('modalTeamH').textContent = m.home;
  document.getElementById('modalTeamA').textContent = m.away;
  document.getElementById('modalLabelH').textContent = m.home.split(' ')[0];
  document.getElementById('modalLabelA').textContent = m.away.split(' ')[0];
  document.getElementById('stepH').textContent = modalScoreH;
  document.getElementById('stepA').textContent = modalScoreA;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  modalMatch = null;
}

function handleOverlayClick(e){
  if(e.target === document.getElementById('modalOverlay')) closeModal();
}

function step(side, delta){
  if(side==='H'){ modalScoreH=Math.max(0,modalScoreH+delta); document.getElementById('stepH').textContent=modalScoreH; }
  else { modalScoreA=Math.max(0,modalScoreA+delta); document.getElementById('stepA').textContent=modalScoreA; }
}

function saveScore(){
  if(!modalMatch) return;
  SCORES[matchKey(modalMatch)] = { scoreH: modalScoreH, scoreA: modalScoreA };
  saveScores(); closeModal(); refreshAll();
}

function clearScore(){
  if(!modalMatch) return;
  delete SCORES[matchKey(modalMatch)];
  saveScores(); closeModal(); refreshAll();
}

// ══════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════
function matchKey(m){ return `${m.home} vs ${m.away}`; }

function parseUTC(d,t){
  let off=0; if(t.includes('+1')){t=t.replace('+1','');off=1;}
  const dt=new Date(d+'T'+t+':00Z'); dt.setDate(dt.getDate()+off); return dt;
}

function fmtSAST(d,t){
  const dt=parseUTC(d,t);
  return {
    date:dt.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short',timeZone:'Africa/Johannesburg'}),
    time:dt.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Johannesburg',hour12:false})+' SAST',
    saDate:dt.toLocaleDateString('en-ZA',{day:'numeric',month:'short',timeZone:'Africa/Johannesburg'}),
    ts:dt.getTime()
  };
}

function isMatchPast(m){ return new Date() > parseUTC(m.date, m.timeUTC); }

// ══════════════════════════════════════════════════════════
// PRED BAR
// ══════════════════════════════════════════════════════════
function updatePredBar(){
  let exact=0,result=0,wrong=0,pending=0;
  GROUPS.forEach(g=>g.matches.forEach(m=>{
    const s=SCORES[matchKey(m)];
    if(!s){pending++;return;}
    if(s.scoreH===m.predH&&s.scoreA===m.predA){exact++;return;}
    const ar=s.scoreH>s.scoreA?'H':s.scoreH<s.scoreA?'A':'D',pr=m.predH>m.predA?'H':m.predH<m.predA?'A':'D';
    if(ar===pr){result++;return;} wrong++;
  }));
  const total=exact+result+wrong+pending;
  document.getElementById('statExact').textContent=exact;
  document.getElementById('statResult').textContent=result;
  document.getElementById('statWrong').textContent=wrong;
  document.getElementById('statPending').textContent=pending;
  const pct=n=>total>0?((n/total)*100).toFixed(1)+'%':'0%';
  document.getElementById('segExact').style.width=pct(exact);
  document.getElementById('segResult').style.width=pct(result);
  document.getElementById('segWrong').style.width=pct(wrong);
  document.getElementById('segPending').style.width=pct(pending);
}

function buildMatchCard(m,gId,mode){
  const key=matchKey(m),s=SCORES[key],kick=fmtSAST(m.date,m.timeUTC);
  const hasScore=s!=null,status=hasScore?'finished':'upcoming';
  const badge=hasScore
    ?'<span class="match-status-badge badge-finished">✓ Full Time</span>'
    :'<span class="match-status-badge badge-upcoming">Upcoming</span>';
  let center;
  if(mode==='result'){
    if(hasScore){
      const ok=s.scoreH===m.predH&&s.scoreA===m.predA;
      center=`${badge}<div class="score-block"><span class="result-score">${s.scoreH}</span><span class="result-sep">–</span><span class="result-score">${s.scoreA}</span></div><div class="pred-label">prediction</div><div class="${ok?'pred-score pred-correct':'pred-score'}">${m.predH}–${m.predA}${ok?' ✓':''}</div>`;
    } else {
      center=`${badge}<div class="enter-score-hint">tap to enter score</div><div class="pred-label">prediction</div><div class="pred-score">${m.predH}–${m.predA}</div>`;
    }
  } else {
    center=`${badge}<div class="score-block"><span class="score pending">${m.predH}</span><span class="score-sep">–</span><span class="score pending">${m.predA}</span></div><div class="pred-label">predicted</div>`;
  }
  const card=document.createElement('div');
  card.className=`match-card status-${status}${mode==='result'?' editable':''}`;
  card.innerHTML=`<div class="team-side left"><div class="flag">${FLAGS[m.home]||'🏳️'}</div><div class="team-name">${m.home}</div></div><div class="match-center"><div style="display:flex;gap:4px;align-items:center;margin-bottom:2px;"><span class="md-tag">MD${m.md}</span><span class="group-tag">GRP ${gId}</span></div>${center}<div class="match-meta"><div class="match-date">${kick.date}</div><div class="match-time">${kick.time}</div><div class="match-venue">${m.venue}</div></div></div><div class="team-side right"><div class="flag">${FLAGS[m.away]||'🏳️'}</div><div class="team-name">${m.away}</div></div>`;
  if(mode==='result') card.addEventListener('click',()=>openModal({...m,_gid:gId}));
  return card;
}

// ══════════════════════════════════════════════════════════
// TAB SWITCHING
// ══════════════════════════════════════════════════════════
function switchTab(id,btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
  if(id==='standings') renderStandings();
  if(id==='playoffs')  renderPlayoffs();
  if(id==='results')   renderResults();
  if(id==='fixtures')  renderFixtures();
}

// ══════════════════════════════════════════════════════════
// RENDERS
// ══════════════════════════════════════════════════════════
function renderFixtures(){
  const c=document.getElementById('fixturesContainer');c.innerHTML='';
  const up=[];
  GROUPS.forEach(g=>g.matches.forEach(m=>{if(SCORES[matchKey(m)])return;const kick=fmtSAST(m.date,m.timeUTC);up.push({m,g:g.id,kick});}));
  if(up.length===0){c.innerHTML='<div class="empty-state"><div class="empty-icon">🏁</div><p>All group stage matches played.</p></div>';return;}
  up.sort((a,b)=>a.kick.ts-b.kick.ts);
  let last='';
  up.forEach(({m,g,kick})=>{
    if(kick.saDate!==last){last=kick.saDate;const d=document.createElement('div');d.className='date-divider';d.innerHTML=`<div class="date-divider-line"></div><div class="date-divider-label">${kick.date.replace(/^[A-Za-z]+,?\s*/,'')}</div><div class="date-divider-line"></div>`;c.appendChild(d);}
    c.appendChild(buildMatchCard(m,g,'upcoming'));
  });
}

function renderResults(){
  const c=document.getElementById('resultsContainer');c.innerHTML='';
  const all=[];
  GROUPS.forEach(g=>g.matches.forEach(m=>{if(!isMatchPast(m))return;const kick=fmtSAST(m.date,m.timeUTC);all.push({m,g:g.id,kick});}));
  if(all.length===0){c.innerHTML='<div class="empty-state"><div class="empty-icon">⏳</div><p>No matches have kicked off yet.</p></div>';return;}
  all.sort((a,b)=>b.kick.ts-a.kick.ts);
  let last='';
  all.forEach(({m,g,kick})=>{
    if(kick.saDate!==last){last=kick.saDate;const d=document.createElement('div');d.className='date-divider';d.innerHTML=`<div class="date-divider-line"></div><div class="date-divider-label">${kick.date.replace(/^[A-Za-z]+,?\s*/,'')}</div><div class="date-divider-line"></div>`;c.appendChild(d);}
    c.appendChild(buildMatchCard(m,g,'result'));
  });
}

function renderStandings(){
  const c=document.getElementById('standingsContainer');c.innerHTML='';
  GROUPS.forEach(g=>{
    const rows={};
    g.teams.forEach(t=>{rows[t]={team:t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0};});
    g.matches.forEach(m=>{const s=SCORES[matchKey(m)];if(!s)return;const h=rows[m.home],a=rows[m.away];h.p++;a.p++;h.gf+=s.scoreH;h.ga+=s.scoreA;a.gf+=s.scoreA;a.ga+=s.scoreH;if(s.scoreH>s.scoreA){h.w++;h.pts+=3;a.l++;}else if(s.scoreH<s.scoreA){a.w++;a.pts+=3;h.l++;}else{h.d++;a.d++;h.pts++;a.pts++;}});
    const sorted=Object.values(rows).sort((a,b)=>{if(b.pts!==a.pts)return b.pts-a.pts;const ga=a.gf-a.ga,gb=b.gf-b.ga;if(gb!==ga)return gb-ga;if(b.gf!==a.gf)return b.gf-a.gf;return a.team.localeCompare(b.team);});
    const block=document.createElement('div');block.className='standings-group';
    const ts=g.teams.map(t=>(FLAGS[t]||'')+' '+t).join(' · ');
    let html=`<div class="group-header"><span class="group-label">GROUP ${g.id}</span><span class="group-teams-list">${ts}</span></div><table class="standings-table"><thead><tr><th style="width:44%">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>`;
    sorted.forEach((r,i)=>{const gd=r.gf-r.ga,gs=gd>0?'+'+gd:gd,gc=gd>0?'pos-gd':gd<0?'neg-gd':'',bar=i===0?'qual-1st':i===1?'qual-2nd':i===2?'qual-3rd':'qual-out';html+=`<tr><td><div class="team-cell"><span class="qual-bar ${bar}"></span><span class="pos-num pos-${i+1}">${i+1}</span><span style="font-size:14px">${FLAGS[r.team]||''}</span><span style="font-size:12px;font-weight:600">${r.team}</span></div></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td class="td-gd ${gc}">${r.p>0?gs:'—'}</td><td class="td-pts">${r.pts}</td></tr>`;});
    html+=`</tbody></table><div class="standings-note"><div class="note-item"><span class="qual-bar qual-1st" style="height:10px;width:10px;border-radius:2px;display:inline-block"></span>1st</div><div class="note-item"><span class="qual-bar qual-2nd" style="height:10px;width:10px;border-radius:2px;display:inline-block"></span>2nd</div><div class="note-item"><span class="qual-bar qual-3rd" style="height:10px;width:10px;border-radius:2px;display:inline-block"></span>3rd (may advance)</div></div>`;
    block.innerHTML=html;c.appendChild(block);
  });
}

function renderPlayoffs(){
  const c=document.getElementById('playoffsContainer');c.innerHTML='';
  const secs=[{title:'Round of 32',data:PLAYOFFS.r32,cols:2},{title:'Round of 16',data:PLAYOFFS.r16,cols:2},{title:'Quarter-finals',data:PLAYOFFS.qf,cols:2},{title:'Semi-finals',data:PLAYOFFS.sf,cols:2},{title:'3rd Place Play-off',data:PLAYOFFS.third,cols:1},{title:'⚽ The Final · 19 July 2026',data:PLAYOFFS.final,cols:1}];
  secs.forEach(sec=>{
    const section=document.createElement('div');section.className='playoff-section';section.innerHTML=`<div class="playoff-section-title">${sec.title}</div>`;
    const grid=document.createElement('div');grid.className=`playoff-grid playoff-grid-${sec.cols}`;
    sec.data.forEach(m=>{
      const kick=fmtSAST(m.date,m.timeUTC),isFinal=m.id==='final';
      const tbA=m.teamA.includes('Winner')||m.teamA.includes('Grp')||m.teamA.includes('Best')||m.teamA.includes('Loser');
      const tbB=m.teamB.includes('Winner')||m.teamB.includes('Grp')||m.teamB.includes('Best')||m.teamB.includes('Loser');
      const card=document.createElement('div');card.className=`playoff-match${isFinal?' final-match':''}`;
      card.innerHTML=`<div class="playoff-match-header"><span>${m.label}</span><span class="match-status-badge badge-upcoming">Upcoming</span></div><div class="playoff-team-row"><div class="playoff-team-name${tbA?' tbd':''}">${tbA?'':((FLAGS[m.teamA]||'')+'&nbsp;')}${m.teamA}</div><div class="playoff-score tbd-score">—</div></div><div class="playoff-team-row"><div class="playoff-team-name${tbB?' tbd':''}">${tbB?'':((FLAGS[m.teamB]||'')+'&nbsp;')}${m.teamB}</div><div class="playoff-score tbd-score">—</div></div><div class="playoff-match-meta">${kick.date} · ${kick.time} · ${m.venue}</div>`;
      grid.appendChild(card);
    });
    section.appendChild(grid);c.appendChild(section);
  });
}

function refreshAll(){
  updatePredBar();
  const id=document.querySelector('.tab-panel.active')?.id?.replace('tab-','');
  if(id==='fixtures') renderFixtures();
  if(id==='results')  renderResults();
  if(id==='standings') renderStandings();
  if(id==='playoffs') renderPlayoffs();
  const scored=Object.keys(SCORES).length;
  document.getElementById('lastUpdated').textContent=scored>0
    ?`${scored} result${scored>1?'s':''} saved · tap any past match on Results to edit`
    :'Go to Results tab · tap any match to enter score';
}

refreshAll();
renderFixtures();
</script>
